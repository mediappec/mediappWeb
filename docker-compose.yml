services:
  landing:
    image: ${LANDING_IMAGE:-mediapp-landing:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GTM_ID: ${PUBLIC_GTM_ID:-}
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-127.0.0.1:13080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
